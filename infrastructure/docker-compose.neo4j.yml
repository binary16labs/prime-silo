version: '3.8'

services:
  neo4j:
    image: neo4j:5.12
    container_name: prime-silo-neo4j
    ports:
      - "7474:7474" # HTTP port
      - "7687:7687" # Bolt port
    environment:
      - NEO4J_AUTH=neo4j/primesilo_dev_password
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    restart: unless-stopped
