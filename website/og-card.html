<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prime-Silo OG Image Card (1200x630)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #171F19;
      color: #F7F6F2;
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 80px;
      position: relative;
      overflow: hidden;
    }
    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #B94B2A;
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 68px;
      line-height: 1.1;
      color: #F7F6F2;
      max-width: 820px;
    }
    .sub {
      font-size: 26px;
      color: #A8BFA8;
      max-width: 760px;
      margin-top: 24px;
      line-height: 1.4;
    }
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 28px;
      font-size: 22px;
      color: #D1CDC7;
    }
    .url {
      font-weight: 600;
      color: #B94B2A;
    }
  </style>
</head>
<body>
  <div>
    <div class="kicker">Sovereign Local-First AI Agent OS</div>
    <h1>Your AI Agent. Your Hardware. Your Auditable Memory.</h1>
    <p class="sub">Deterministic tri-graph knowledge mesh, local-model execution, and HMAC-signed governance.</p>
  </div>
  <div class="bottom-row">
    <span>Binary 16 Labs</span>
    <span class="url">binary16labs.github.io/prime-silo</span>
  </div>
</body>
</html>
