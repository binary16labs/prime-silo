<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{metaTitle}}</title>
  <meta name="description" content="{{metaDescription}}" />
  <meta name="keywords" content="{{keywords}}" />
  <meta property="og:title" content="{{ogTitle}}" />
  <meta property="og:description" content="{{ogDescription}}" />
  <meta property="og:image" content="{{ogImage}}" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ogTitle}}" />
  <meta name="twitter:description" content="{{ogDescription}}" />
  <meta name="twitter:image" content="{{ogImage}}" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="application/ld+json">
{{jsonLd}}
  </script>
</head>
<body>
  <!-- Shared SVG defs: gradients + static Benny symbol (footer use) -->
  <svg style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="benny-tan" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#D79A52"/><stop offset="1" stop-color="#B97A38"/>
      </linearGradient>
      <linearGradient id="benny-black" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3A322C"/><stop offset="1" stop-color="#241E1A"/>
      </linearGradient>
      <linearGradient id="benny-chest" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#EBCD9C"/><stop offset="1" stop-color="#D8B074"/>
      </linearGradient>
    </defs>
    <symbol id="benny-symbol" viewBox="0 0 256 256">{{bennyParts}}</symbol>
  </svg>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="#" class="nav-brand"><span>Prime-Silo</span></a>
    <div class="nav-right">
      <ul class="nav-links">
        {{navPrimary}}
      </ul>
      <details class="nav-more">
        <summary>More</summary>
        <ul class="nav-more-list">
          {{navMore}}
        </ul>
      </details>
      {{navCta}}
    </div>
  </nav>

  <main>
{{main}}
  </main>

  <!-- Footer -->
  <footer class="footer">
    {{footerSection}}
  </footer>

  <!-- Neuro-Assist Accessibility Dock -->
  <aside class="neuro-dock" aria-label="Neuro-Assist Accessibility">
    <button class="neuro-btn" id="toggle-dyslexic" title="Toggle OpenDyslexic font">Dyslexic Font</button>
    <button class="neuro-btn" id="toggle-bionic" title="Toggle Bionic Reading highlight">Bionic</button>
    <button class="neuro-btn" id="toggle-motion" title="Toggle Calm Motion mode">Calm Motion</button>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
